<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg">

    <!-- Background -->
    <rect width="256" height="256" rx="44" fill="#2563EB"/>

    <defs>
        <!-- Reusable star -->
        <polygon id="star"
                 points="
                0,-8
                2.4,-2.4
                8,0
                2.4,2.4
                0,8
                -2.4,2.4
                -8,0
                -2.4,-2.4"
                 fill="white"
                 stroke="white"
                 stroke-width="0.8"
                 stroke-linejoin="round"/>
    </defs>

    <!-- Row 1 -->
    <use href="#star" x="128" y="48"/>

    <!-- Row 2 -->
    <use href="#star" x="112" y="76"/>
    <use href="#star" x="128" y="76"/>
    <use href="#star" x="144" y="76"/>

    <!-- Row 3 -->
    <use href="#star" x="96" y="104"/>
    <use href="#star" x="112" y="104"/>
    <use href="#star" x="128" y="104"/>
    <use href="#star" x="144" y="104"/>
    <use href="#star" x="160" y="104"/>

    <!-- Row 4 -->
    <use href="#star" x="80" y="132"/>
    <use href="#star" x="96" y="132"/>
    <use href="#star" x="112" y="132"/>
    <use href="#star" x="128" y="132" fill="#FFD54F"/>
    <use href="#star" x="144" y="132"/>
    <use href="#star" x="160" y="132"/>
    <use href="#star" x="176" y="132"/>

    <!-- Row 5 -->
    <use href="#star" x="96" y="160"/>
    <use href="#star" x="112" y="160"/>
    <use href="#star" x="128" y="160"/>
    <use href="#star" x="144" y="160"/>
    <use href="#star" x="160" y="160"/>

    <!-- Row 6 -->
    <use href="#star" x="112" y="188"/>
    <use href="#star" x="128" y="188"/>
    <use href="#star" x="144" y="188"/>

    <!-- Row 7 -->
    <use href="#star" x="128" y="216"/>

</svg>